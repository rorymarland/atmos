# Builds the Docker images and publishes them to ghcr.io/rorymarland/atmos and
# ghcr.io/rorymarland/atmos-alerts (after the checks pass): :latest on every push to main,
# and :1.2.3, :1.2 and :1 for a version tag (v1.2.3). The NAS pulls :latest, or a version
# to stay on a release.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One queue per branch or tag, so a release tag doesn't cancel the main build (or the reverse).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: atmos
            file: docker/Dockerfile
          - name: atmos-alerts
            file: docker/alerts.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # :latest only from main (the action would otherwise add it for version tags too).
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          # The NAS (UGREEN DXP4800 Plus) is x86-64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
