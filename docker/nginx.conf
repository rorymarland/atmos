# Included in nginx's http context (conf.d), so `map` is allowed here.
# Cache-Control is chosen per path in one place, because an add_header inside a
# location block would stop the server-level security headers from being inherited.
map $uri $atmos_cache_control {
  ~^/_app/immutable/                                   "public, max-age=31536000, immutable";
  ~^/data/                                             "public, max-age=3600, must-revalidate";
  default                                              "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header Cache-Control $atmos_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /_app/immutable/ {
    try_files $uri =404;
  }

  location /data/ {
    try_files $uri =404;
  }

  # Single-page app fallback. The default "no-cache" keeps index.html and the
  # service worker fresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
