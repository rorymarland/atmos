# Included in nginx's http context (conf.d), so `map` is allowed here.
# Cache-Control is chosen per path in one place, because an add_header inside a
# location block would stop the server-level security headers from being inherited.
map $uri $atmos_cache_control {
  ~^/_app/immutable/                                   "public, max-age=31536000, immutable";
  # Data is rebuilt at every container start and must match the app: always revalidate
  # (a 304 costs next to nothing).
  ~^/data/                                             "no-cache";
  default                                              "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The build ships .gz copies of every asset; serve them directly.
  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header Cache-Control $atmos_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # MapLibre's tile worker is an ES module (.mjs). nginx's stock mime.types has no .mjs
  # entry, and with nosniff the browser refuses an octet-stream module: the map stays
  # blank. Must come before the prefix locations below (regex locations win).
  location ~* \.mjs$ {
    types {
      text/javascript mjs;
    }
    try_files $uri =404;
  }

  location /_app/immutable/ {
    try_files $uri =404;
  }

  location /data/ {
    try_files $uri =404;
  }

  # The optional alerts container (atmos-alerts in docker-compose.yml). Looked up when a
  # request arrives rather than at start, so Atmos runs fine without it: the alerts page
  # just says it isn't running.
  location /api/alerts {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $alerts_upstream http://atmos-alerts:8080;
    proxy_pass $alerts_upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @no_alerts;
  }
  location @no_alerts {
    default_type application/json;
    return 503 '{"error":"The alerts service isn\'t running"}';
  }

  # Pages are prerendered as /map.html etc.; anything else falls back to the app shell.
  # The default "no-cache" keeps the HTML fresh.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
