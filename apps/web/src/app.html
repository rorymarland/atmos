<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="description" content="Atmos. Find the conditions. Capture the moment." />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>Atmos</title>
    <script src="%sveltekit.assets%/defaults.js"></script>
    <script>
      // Apply the theme before first paint, so dark mode doesn't flash light.
      try {
        const d = window.__ATMOS_DEFAULTS__ || {};
        const s = JSON.parse(localStorage.getItem('atmos.settings') || '{}');
        document.documentElement.dataset.theme = s.theme || d.theme || 'light';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
