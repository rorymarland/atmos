# Atmos on the NAS. Only three files are needed in this folder:
#
#   docker-compose.yml   this file
#   .env                 copied from .env.example
#   DoBIH_v18_6.csv      the hills database download (any name ending .csv)
#
#   docker compose up -d                          # first run
#   docker compose pull && docker compose up -d   # update to the latest version
#
# The hill data is rebuilt from the CSV each time the container starts, so a new CSV
# only needs `docker compose restart`.
#
# atmos-alerts is optional: it emails people when the forecast matches their alerts. Fill
# in the SMTP settings in .env first. Its alerts are kept in ./alerts. Remove the service
# to run Atmos without alerts; the Alerts page then hides itself.

services:
  atmos:
    image: ghcr.io/rorymarland/atmos:latest
    container_name: atmos
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      ATMOS_DEFAULT_THEME: ${ATMOS_DEFAULT_THEME:-light}
      ATMOS_DEFAULT_WIND_UNIT: ${ATMOS_DEFAULT_WIND_UNIT:-kmh}
      # Optional: read from the CSV's file name (DoBIH_v18_6.csv) when empty.
      DOBIH_VERSION: ${DOBIH_VERSION:-}
    volumes:
      # This folder, read-only: the container looks for the one .csv in it.
      - ./:/data:ro
    ports:
      - '${ATMOS_PORT:-8085}:80'
    # To reach it only through Nginx Proxy Manager on a shared Docker network instead of
    # a host port: remove `ports`, uncomment below, and point NPM at http://atmos:80.
    # networks:
    #   - proxy

  atmos-alerts:
    image: ghcr.io/rorymarland/atmos-alerts:latest
    container_name: atmos-alerts
    restart: unless-stopped
    depends_on:
      - atmos
    environment:
      TZ: ${TZ:-Europe/London}
      # The address people use for Atmos, for links in the emails.
      ATMOS_URL: ${ATMOS_URL:-http://localhost:8085}
      SMTP_HOST: ${SMTP_HOST:-mail.smtp2go.com}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERTS_FROM: ${ALERTS_FROM:-}
    volumes:
      - ./alerts:/data
    # No ports: Atmos's nginx passes /api/alerts to it over this compose network. If you
    # move atmos onto the proxy network below, add that network here too.

# networks:
#   proxy:
#     external: true
#     name: ${PROXY_NETWORK:-proxy}
