# Atmos on the NAS: builds from this checkout and serves the static site with nginx.
#
#   cp .env.example .env        # then edit it
#   docker compose up -d --build
#
# Rebuild (`--build`) after pulling new code, changing .env, or updating the DoBIH CSV.

services:
  atmos:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Optional: read from the CSV's file name (DoBIH_v18_6.csv) when left empty.
        DOBIH_VERSION: ${DOBIH_VERSION:-}
        ATMOS_DEFAULT_THEME: ${ATMOS_DEFAULT_THEME:-light}
        ATMOS_DEFAULT_WIND_UNIT: ${ATMOS_DEFAULT_WIND_UNIT:-kmh}
    image: atmos:local
    # Built here, never pulled: stops Compose looking for "atmos" on Docker Hub first.
    pull_policy: build
    container_name: atmos
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
    ports:
      - '${ATMOS_PORT:-8085}:80'
    # To reach it only through Nginx Proxy Manager on a shared Docker network instead of
    # a host port: remove `ports`, uncomment below, and point NPM at http://atmos:80.
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: ${PROXY_NETWORK:-proxy}
