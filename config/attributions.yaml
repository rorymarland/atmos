# Data credits shown in the app's About page and on the map. `{dobihVersion}` is
# filled in by the build from --dobih-version.

attributions:
  - id: open-meteo
    name: Open-Meteo
    url: https://open-meteo.com/
    licence: CC BY 4.0
    use: Weather forecasts (UK Met Office, ECMWF and DWD ICON models)
    terms: Free API for non-commercial use
  - id: dobih
    name: Database of British and Irish Hills v{dobihVersion}
    url: https://www.hills-database.co.uk/
    licence: CC BY 4.0
    use: Hill names, heights, positions and lists
  - id: aurorawatch
    name: AuroraWatch UK, Lancaster University
    url: https://aurorawatch.lancs.ac.uk/
    licence: Non-commercial use only
    use: Aurora alert status
    terms: Alert status generated by AuroraWatch UK
  - id: openstreetmap
    name: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL
    use: Basemap data, served by OpenFreeMap
