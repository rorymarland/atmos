# Forecast zones (v1 draft: review the points before relying on them).
#
# Each zone is forecast at ONE low-lying point: a valley floor, village or lochside.
# The model column then starts near the valley floor, where inversions and mist form,
# and its upper levels cover every summit in the zone. Hills are assigned to the
# nearest zone point within `maxAssignKm`; hills further away are left unzoned.

